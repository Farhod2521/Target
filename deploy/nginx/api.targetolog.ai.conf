# /etc/nginx/sites-available/api.targetolog.ai
# Then: ln -s ../sites-available/api.targetolog.ai /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#       certbot --nginx -d api.targetolog.ai   (adds the 443 block itself)

server {
    listen 80;
    listen [::]:80;
    server_name api.targetolog.ai;

    # Video and photo uploads.
    client_max_body_size 300m;

    # Only the testimonials are public - the one folder storage.url() hands
    # out. Everything else under media/ is somebody's: the pictures of a
    # launch not yet running, half-sent uploads, referral feedback. Those are
    # served by the API, which checks whose they are.
    location /media/testimonials/ {
        alias /home/user/backend/Target/media/testimonials/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
