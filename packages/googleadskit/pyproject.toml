[project]
name = "googleadskit"
version = "0.8.0"
description = "Google Ads API (REST) va uning adskit adapteri"
requires-python = ">=3.13,<3.14"
# The same three as metaads - httpx for the wire, pydantic for the answers,
# adskit for the contract the adapter speaks - and googlekit, because the
# stored credential is a refresh token and trading it for an access token
# before every call is the adapter's job, done by Google's one OAuth code.
dependencies = [
    "adskit",
    "googlekit",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
adskit = { workspace = true }
googlekit = { workspace = true }
