[project]
name = "telegramkit"
version = "0.9.0"
description = "Telegram Bot API klienti — xabar yuborish va update o'qish"
requires-python = ">=3.13,<3.14"
# httpx and pydantic, like metaads, and nothing else. No adskit: a bot has
# nothing to do with advertising, and depending on the contract package
# would tie a chat client's release to an ad platform's.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
