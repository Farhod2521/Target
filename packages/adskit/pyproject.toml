[project]
name = "adskit"
version = "0.25.0"
description = "Reklama platformalari uchun portlar, DTO va registry"
requires-python = ">=3.13,<3.14"
# stdlib + pydantic, and nothing else, ever. adskit is the contract every
# other package implements; a dependency here becomes everyone's dependency.
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
