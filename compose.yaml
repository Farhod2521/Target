# docker compose up -d --build
# Settings come from .env (the old .env.prod copied here). The addresses of
# the database and Redis are set below, so .env's own values for them are
# ignored. DB_PASSWORD must be in .env.

x-app: &app
  build: .
  image: targetolog-api
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://targetolog:${DB_PASSWORD:?DB_PASSWORD .env da yo'q}@db:5432/targetolog
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    CHANNELS_REDIS_URL: redis://redis:6379/3
    MEDIA_ROOT: /app/media
  volumes:
    - ./media:/app/media
    - ./logs:/app/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: targetolog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da yo'q}
      POSTGRES_DB: targetolog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U targetolog -d targetolog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    <<: *app
    # Only nginx on this machine reaches it; the outside world goes through
    # https://api.targetolog.ai.
    ports:
      - "127.0.0.1:8100:8000"

  worker:
    <<: *app
    command: celery -A app.worker worker -Q sync,webhooks,chat,upload,refresh --concurrency 2 --loglevel INFO

  # The AI and the launch wizard's own work (goal reading, the proposal,
  # changes to campaigns) on slots of their own, so a person waiting on the
  # screen is never queued behind an account sync.
  worker-agent:
    <<: *app
    command: celery -A app.worker worker -Q agent --concurrency 3 --hostname agent@%h --loglevel INFO

  # The clock: syncs, sweeps, lapsed subscriptions. Off until asked for,
  # because while the old Django project still runs its own beat, two clocks
  # would sync, pause and resume the same ad accounts twice. Once Django is
  # stopped:  docker compose --profile beat up -d beat
  beat:
    <<: *app
    command: celery -A app.worker beat --loglevel INFO
    profiles: ["beat"]

volumes:
  pgdata:
  redisdata:
