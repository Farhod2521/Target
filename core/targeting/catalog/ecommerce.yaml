# Onlayn do'kon. Meta vocabulary, no interest ids - see restaurant.yaml.
#
# Country-wide: an online shop delivers past the end of any radius.
provider: meta
category: ecommerce
label: "Onlayn do'kon"
version: 6

interest_seeds:
  - { label: "Onlayn xarid", query: "Online shopping" }
  - { label: "Elektron tijorat", query: "E-commerce" }
  - { label: "Xarid qilish", query: "Shopping" }
  - { label: "Moda", query: "Fashion" }
  - { label: "Elektronika", query: "Consumer electronics" }
  - { label: "Chegirmalar", query: "Coupons" }
  - { label: "Telefonlar", query: "Mobile phones" }
  - { label: "Uy jihozlari", query: "Home appliances" }


# Behaviours and life events. **Not interests**, and not searched for: these
# are closed lists Meta publishes, matched by name exactly, so a name that
# is not on the list resolves to nothing rather than to something close.
#
# That is a safe failure and it is visible: an unmatched seed appears on the
# review screen as a name the provider did not recognise, exactly as an
# unmatched interest does, and the campaign is built without it. Which is
# why these are written from the published class names and corrected
# against the staff console rather than guessed at twice.
#
# Kept short on purpose. The value here is not coverage - it is the one or
# two rows that describe a customer no interest could reach.
trait_seeds:
  - { label: "Onlayn xarid qiladiganlar", query: "Engaged Shoppers", kind: behaviour }

targeting_base:
  geo_locations:
    countries: ["{business.country_code}"]
  age_min: "{answers.age_min}"
  age_max: "{answers.age_max}"
  genders: "{answers.genders}"
  locales: "{business.locales}"
  # No placements here, and none in any preset below: where the ad appears
  # is one answer with two states, in core/targeting/placements.py, and the
  # loader refuses a placement key in this file.

presets:
  - goal: leads
    label: "Ariza / lid"
    objective: OUTCOME_LEADS
    optimization_goal: LEAD_GENERATION
    billing_event: IMPRESSIONS
    sends_to: form
    call_to_action: SIGN_UP
    destination_type: ON_AD
    defaults:
      age_min: 20
      age_max: 50

  - goal: messages
    label: "Xabar yozish"
    objective: OUTCOME_ENGAGEMENT
    optimization_goal: CONVERSATIONS
    billing_event: IMPRESSIONS
    sends_to: chat
    welcome_message: "{business.name} — salom! Mahsulot, o'lcham va yetkazib berish bo'yicha shu yerda so'rang, tez orada javob beramiz."
    autofill_message: "Salom! Ushbu taklif haqida ma'lumot bering."
    chat_questions:
      - "Narxi qancha?"
      - "Yetkazib berish bormi?"
      - "Qaysi o'lchamlar bor?"
    defaults:
      age_min: 20
      age_max: 50

  - goal: calls
    label: "Qo'ng'iroq olish"
    objective: OUTCOME_TRAFFIC
    optimization_goal: QUALITY_CALL
    billing_event: IMPRESSIONS
    sends_to: phone
    call_to_action: CALL_NOW
    destination_type: PHONE_CALL
    defaults:
      age_min: 20
      age_max: 50

  - goal: views
    label: "Ko'proq ko'rilsin"
    objective: OUTCOME_AWARENESS
    optimization_goal: IMPRESSIONS
    billing_event: IMPRESSIONS
    sends_to: nothing
    call_to_action: NO_BUTTON
    defaults:
      age_min: 18
      age_max: 50

  # The same website as the withdrawn preset below, and **no
  # destination_type**. Meta's own table lists WEBSITE against
  # OUTCOME_LEADS and OUTCOME_SALES and gives OUTCOME_TRAFFIC only
  # UNDEFINED, MESSENGER, WHATSAPP and PHONE_CALL - and UNDEFINED is
  # "returned only in read mode", so there is nothing to send. Where the
  # ad goes is said by the creative's link.
  - goal: traffic
    label: "Saytga tashrif"
    objective: OUTCOME_TRAFFIC
    optimization_goal: LANDING_PAGE_VIEWS
    billing_event: IMPRESSIONS
    sends_to: website
    call_to_action: LEARN_MORE
    defaults:
      age_min: 20
      age_max: 50

  # The visit that stays inside Instagram: the tap opens the business's own
  # profile. Built from the connected account - nothing is typed, and a
  # page with no Instagram account behind it cannot choose this. The
  # placement is Instagram only whatever the owner answers; see
  # core/targeting/placements.py:INSTAGRAM_PLACEMENTS.
  - goal: profile_visits
    label: "Profilga o'tsin"
    objective: OUTCOME_TRAFFIC
    optimization_goal: PROFILE_VISIT
    billing_event: IMPRESSIONS
    sends_to: profile
    call_to_action: VIEW_INSTAGRAM_PROFILE
    destination_type: INSTAGRAM_PROFILE
    defaults:
      age_min: 20
      age_max: 50

  - goal: site_leads
    label: "Saytda ariza"
    objective: OUTCOME_LEADS
    optimization_goal: OFFSITE_CONVERSIONS
    billing_event: IMPRESSIONS
    sends_to: website
    call_to_action: SIGN_UP
    # No destination_type: the website lead ad sets advertisers here run
    # from Ads Manager carry none, and those are the ones that delivered.
    # The request is left on the owner's own site, so Meta only hears of it
    # through a pixel. The id is the one chosen on the connect screen; with
    # none the builder leaves this empty and validate_launchable stops the
    # launch.
    promoted_object:
      pixel_id: "{conversion.external_id}"
      custom_event_type: LEAD
    defaults:
      age_min: 20
      age_max: 50

  # Withdrawn, not deleted - the treatment "Tanilish" got in
  # restaurant.yaml, and for a nearer reason. This is the only goal in the
  # catalogue that cannot be launched without a pixel, and the wizard opens
  # on the first goal its category lists: an online shop would otherwise be
  # offered a goal the launch gate refuses, several screens before anything
  # said so. Launches that already answered "sales" still find their preset
  # here.
  - goal: sales
    offered: false
    label: "Onlayn sotuv"
    objective: OUTCOME_SALES
    optimization_goal: OFFSITE_CONVERSIONS
    billing_event: IMPRESSIONS
    sends_to: website
    call_to_action: SHOP_NOW
    destination_type: WEBSITE
    # Meta refuses to create an ad set optimising for OFFSITE_CONVERSIONS
    # without one of these. The id is filled from the pixel the owner chose
    # on the connect screen; when there is none, the builder leaves this
    # empty and validate_launchable is what stops the launch.
    promoted_object:
      pixel_id: "{conversion.external_id}"
      custom_event_type: PURCHASE
    defaults:
      age_min: 20
      age_max: 50
